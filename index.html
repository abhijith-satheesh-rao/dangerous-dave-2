/* --------------------- SPRITE PRE-RENDERING / CACHE --------------------- */
const spriteCache = new Map();
function bakeSprite(grid, flip){
  const w = grid[0].length, h = grid.length;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  for(let y=0;y<h;y++){
    const row = grid[y];
    for(let x=0;x<w;x++){
      const ch = row[x];
      if(ch === '.' || ch === undefined) continue;
      g.fillStyle = PAL[ch] || '#FF00FF';
      g.fillRect(flip ? (w-1-x) : x, y, 1, 1);
    }
  }
  return cv;
}
function sprite(grid, flip){
  if(!grid.__id) grid.__id = 'S' + (spriteCache.size + 1) + '_' + Math.round(grid.length);
  const key = grid.__id + (flip?'|f':'');
  let cv = spriteCache.get(key);
  if(!cv){ cv = bakeSprite(grid, !!flip); spriteCache.set(key, cv); }
  return cv;
}
function drawSprite(ctx, grid, x, y, flip, alpha){
  if(alpha !== undefined && alpha < 1){
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.drawImage(sprite(grid, flip), Math.round(x), Math.round(y));
    ctx.restore();
  } else {
    ctx.drawImage(sprite(grid, flip), Math.round(x), Math.round(y));
  }
}

/* ------------------------------ TEXT ----------------------------------- */
function drawText(ctx, str, x, y, col, scale){
  scale = scale || 1;
  ctx.fillStyle = PAL[col] || col;
  str = String(str).toUpperCase();
  let cx = x;
  for(let i=0;i<str.length;i++){
    const g = FONT[str[i]];
    if(g){
      for(let ry=0;ry<7;ry++){
        const bits = g[ry];
        if(!bits) continue;
        for(let rx=0;rx<5;rx++){
          if(bits & (1 << (4-rx))) ctx.fillRect(cx + rx*scale, y + ry*scale, scale, scale);
        }
      }
    }
    cx += CHAR_W * scale;
  }
}
function textWidth(str, scale){ return String(str).length * CHAR_W * (scale||1); }
function drawTextCentered(ctx, str, y, col, scale){
  drawText(ctx, str, Math.round((VW - textWidth(str, scale))/2), y, col, scale);
}

/* ------------------------------- AUDIO ---------------------------------- */
let AC = null, masterGain = null, ambGain = null, muted = false;
function initAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.28;
    masterGain.connect(AC.destination);
    startAmbience();
  }catch(e){ AC = null; }
}
function startAmbience(){
  // Extremely subtle low pulse, mimicking PC-speaker room tone.
  if(!AC) return;
  const osc = AC.createOscillator();
  const lfo = AC.createOscillator();
  const lfoGain = AC.createGain();
  ambGain = AC.createGain();
  osc.type = 'square'; osc.frequency.value = 55;
  lfo.type = 'sine';   lfo.frequency.value = 0.14;
  lfoGain.gain.value = 0.004;
  ambGain.gain.value = 0.005;
  lfo.connect(lfoGain); lfoGain.connect(ambGain.gain);
  osc.connect(ambGain); ambGain.connect(masterGain);
  osc.start(); lfo.start();
}
function tone(type, f0, f1, dur, vol, delay){
  if(!AC || muted) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol === undefined ? 0.2 : vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol){
  if(!AC || muted) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const g = AC.createGain(); g.gain.value = vol || 0.18;
  src.connect(g); g.connect(masterGain); src.start();
}

/* -------------------------- TILE PRE-RENDERING -------------------------- */
/* Every tile glyph gets baked once per theme into a 16x16 offscreen canvas. */
let tileCanvas = {};      // glyph -> canvas
let hazardFrames = [];    // animated liquid frames

function px(g, x, y, w, h, c){ g.fillStyle = PAL[c]; g.fillRect(x, y, w, h); }
function newTile(){ const cv = document.createElement('canvas'); cv.width=TS; cv.height=TS; return cv; }

function bakeBlock(th){
  const cv = newTile(), g = cv.getContext('2d');
  px(g,0,0,TS,TS,th.block);
  switch(th.style){
    case 'brick':
      px(g,0,0,TS,1,th.hi);                       // top highlight
      px(g,0,7,TS,1,th.mortar); px(g,0,15,TS,1,th.mortar);
      px(g,7,0,1,8,th.mortar);  px(g,3,8,1,8,th.mortar); px(g,11,8,1,8,th.mortar);
      px(g,1,1,4,2,th.hi); px(g,9,1,4,2,th.hi);
      px(g,1,9,1,2,th.hi); px(g,5,9,4,2,th.hi);
      break;
    case 'stone':
      px(g,0,0,TS,1,th.hi);
      px(g,0,0,1,TS,th.hi);
      px(g,2,3,4,3,th.mortar); px(g,9,2,5,4,th.mortar);
      px(g,3,9,6,3,th.mortar); px(g,11,10,3,4,th.mortar);
      px(g,0,15,TS,1,th.mortar);
      break;
    case 'ice':
      px(g,0,0,TS,2,th.hi);
      px(g,0,0,2,TS,th.hi);
      px(g,12,3,2,9,'F'); px(g,4,6,2,5,'F');
      px(g,8,10,3,2,'B');
      px(g,0,15,TS,1,'3');
      break;
    case 'sand':
      px(g,0,0,TS,1,th.hi);
      px(g,0,5,TS,1,'0'); px(g,0,11,TS,1,'0');
      px(g,4,1,3,3,th.hi); px(g,10,6,4,4,th.hi); px(g,2,12,5,2,th.hi);
      break;
    case 'metal':
      px(g,0,0,TS,1,th.hi); px(g,0,0,1,TS,th.hi);
      px(g,15,0,1,TS,'0'); px(g,0,15,TS,1,'0');
      px(g,3,3,2,2,th.hi); px(g,11,3,2,2,th.hi);
      px(g,3,11,2,2,th.hi); px(g,11,11,2,2,th.hi);
      px(g,7,6,3,4,'8');
      break;
    case 'cloud':
      px(g,0,0,TS,TS,'7');
      px(g,0,0,TS,3,'F'); px(g,2,3,12,3,'F');
      px(g,0,12,TS,4,'8');
      px(g,4,7,3,2,'F'); px(g,10,8,3,2,'F');
      break;
  }
  return cv;
}
function bakePlank(th){
  const cv = newTile(), g = cv.getContext('2d');
  px(g,0,2,TS,8,th.plank);
  px(g,0,2,TS,1,th.plankHi);
  px(g,0,9,TS,1,'0');
  px(g,4,4,1,4,'0'); px(g,11,4,1,4,'0');
  return cv;
}
function bakeSpikes(th){
  // A row of four barbs sitting on a dark base plate.
  const cv = newTile(), g = cv.getContext('2d');
  for(let s=0;s<4;s++){
    const bx = s*4;
    px(g, bx,     13, 4, 3, '8');      // base
    px(g, bx + 1,  9, 2, 4, th.spike); // shaft
    px(g, bx + 1,  7, 1, 2, th.spike); // tip
    px(g, bx,     13, 1, 3, th.spike);
  }
  return cv;
}
function bakeHazard(th, frame){
  const cv = newTile(), g = cv.getContext('2d');
  px(g,0,2,TS,14,th.hazard);
  for(let x=0;x<TS;x++){
    const wave = Math.sin((x + frame*3) * 0.5) > 0 ? 0 : 1;
    px(g,x,2+wave,1,2,th.hazard2);
  }
  px(g,(frame*5)%TS,7,3,1,th.hazard2);
  px(g,(frame*7+9)%TS,11,2,1,th.hazard2);
  return cv;
}
function bakeQuicksand(th){
  const cv = newTile(), g = cv.getContext('2d');
  px(g,0,1,TS,15,'6');
  px(g,0,1,TS,1,'E');
  for(let i=0;i<6;i++) px(g,(i*5)%15,4+((i*7)%10),2,1,'E');
  px(g,3,8,6,1,'8'); px(g,10,12,4,1,'8');
  return cv;
}
function bakeDoor(open, th){
  const cv = document.createElement('canvas'); cv.width=TS; cv.height=TS*2;
  const g = cv.getContext('2d');
  px(g,0,0,TS,TS*2, open ? '6' : '8');
  px(g,1,1,TS-2,TS*2-2, open ? 'E' : '7');
  px(g,3,3,TS-6,TS*2-5, open ? '0' : '8');
  if(open){
    px(g,4,4,TS-8,TS*2-7,'0');
    px(g,5,6,2,2,'E'); px(g,9,14,2,2,'E'); px(g,6,22,2,2,'E');
  } else {
    px(g,6,14,4,5,'E');            // padlock body
    px(g,7,11,2,3,'E');            // shackle
    px(g,7,16,2,2,'0');
  }
  return cv;
}
function bakeTiles(th){
  tileCanvas = {};
  tileCanvas['#'] = bakeBlock(th);
  tileCanvas['-'] = bakePlank(th);
  tileCanvas['^'] = bakeSpikes(th);
  tileCanvas['Q'] = bakeQuicksand(th);
  hazardFrames = [0,1,2,3].map(f => bakeHazard(th, f));
  tileCanvas['DOOR_OPEN']   = bakeDoor(true, th);
  tileCanvas['DOOR_CLOSED'] = bakeDoor(false, th);
}

/* --------------------------- DEV / TEST MODE ----------------------------
   Off by default: in normal play the title screen shows no level selector

     • Browser   append ?dev=1  (or #dev) to the URL
     • Anywhere  type DEV on the title screen to toggle it

   The Mac shell remembers the toggle between launches.

let devMode = /[?&]dev=1(&|$)/.test(location.search) || location.hash === '#dev';

function setDevMode(on){
  devMode = !!on;
  if(!devMode) game.selectedLevel = 0;  // never leave a stale pick behind
  return devMode;
}

/* --------------------------- LEVEL CONSTRUCTION ------------------------- */
function parseLevel(idx){
  const def = LEVELS[idx];
  const th  = THEMES[def.theme];
  const rows = def.rows.slice();
  const W = rows.reduce((m,r)=>Math.max(m, r.length), 0);
  const grid = rows.map(r => r.padEnd(W,' ').split(''));

  const L = {
    def, theme: th, W, H: rows.length,
    grid,
    pickups: [], enemies: [], movers: [], vents: [], chandeliers: [],
    projectiles: [], particles: [],
    door: null, relicsNeeded: 0, relicsGot: 0,
    camX: 0, hazardT: 0, boss: null, bossDefeated: false,
    slippery: !!th.slippery
  };

  const enemyKind = { e: def.enemy, g:'ghost', i:'imp', k:'knight', s:'spider' };

  for(let y=0;y<L.H;y++){
    for(let x=0;x<W;x++){
      const ch = grid[y][x];
      const wx = x*TS, wy = y*TS;
      switch(ch){
        case 'P':
          player.spawnX = wx + 2; player.spawnY = wy + (TS - player.h);
          grid[y][x] = ' ';
          break;
        case 'D':
          // Door occupies two tiles vertically, anchored on its bottom tile.
          L.door = { x: wx, y: wy - TS, w: TS, h: TS*2, open:false };
          grid[y][x] = ' ';
          break;
        case 'd': case 'r': case 'c': case 'T': case 'R':
          L.pickups.push({ kind: ch, x: wx, y: wy, w: TS, h: TS, taken:false, bob: (x*7+y*13)%628/100 });
          if(ch === 'R') L.relicsNeeded++;
          grid[y][x] = ' ';
          break;
        case 'e': case 'g': case 'i': case 'k': case 's':
          L.enemies.push(makeEnemy(enemyKind[ch], wx, wy));
          grid[y][x] = ' ';
          break;
        case 'B':
          L.boss = makeEnemy('boss', wx, wy);
          L.enemies.push(L.boss);
          L.relicsNeeded++;   // the relic is carried by Dr. Dark
          grid[y][x] = ' ';
          break;
        case 'm':
          L.movers.push({ x:wx, y:wy, w:TS*3, h:10, ox:wx, oy:wy, dir:1, axis:'x', range:52, speed:34, dx:0, dy:0 });
          grid[y][x] = ' ';
          break;
        case 'v':
          L.movers.push({ x:wx, y:wy, w:TS*3, h:10, ox:wx, oy:wy, dir:1, axis:'y', range:48, speed:30, dx:0, dy:0 });
          grid[y][x] = ' ';
          break;
        case 'f':
          L.vents.push({ x:wx+4, y:wy, t: (x%3)*0.7, period: 2.1 });
          grid[y][x] = '~';       // vents sit inside the lava
          break;
        case 'x':
          L.chandeliers.push({ x:wx, y:wy, w:TS, h:12, vy:0, state:'hang', respawn:0, oy:wy });
          grid[y][x] = ' ';
          break;
      }
    }
  }
  return L;
}

function makeEnemy(kind, x, y){
  const g = SPR[kind];
  const w = g[0].length, h = g.length;
  const e = {
    kind, grid:g, w, h,
    x: x + (TS - w)/2,
    y: y + (TS - h),
    ox: x + (TS - w)/2, oy: y + (TS - h),
    vx:0, vy:0, dir:-1, t: Math.random()*6, alive:true,
    hp:1, hurtT:0, fireT:1.2
  };
  switch(kind){
    case 'drone':    e.speed = 46; e.range = 56; e.fly = true;  break;
    case 'rat':      e.speed = 42; e.range = 64; e.ground = true; break;
    case 'ghost':    e.speed = 32; e.range = 64; e.fly = true;  e.amp = 22; break;
    case 'bear':     e.speed = 26; e.range = 56; e.ground = true; break;
    case 'scorpion': e.speed = 64; e.range = 72; e.ground = true; break;
    case 'imp':      e.speed = 38; e.range = 56; e.ground = true; e.hops = true; e.hopT = 0.8; break;
    case 'airship':  e.speed = 112; e.range = 86; e.fly = true; break;
    case 'spider':   e.speed = 50; e.range = 64; e.ground = true; break;
    case 'knight':   e.speed = 22; e.range = 52; e.ground = true; break;
    case 'boss':     e.speed = 40; e.range = 90; e.ground = true; e.hp = 3; e.fireT = 1.4; break;
  }
  return e;
}

/* ------------------------------ TILE HELPERS ---------------------------- */
function tileAt(cx, cy){
  if(cx < 0 || cx >= level.W) return '#';           // level edges are walls
  if(cy < 0) return ' ';
  if(cy >= level.H) return ' ';                     // below the map = the void
  return level.grid[cy][cx];
}
function isSolidChar(ch){ return ch === '#' || ch === '-'; }
function isSolidAt(cx, cy){ return isSolidChar(tileAt(cx, cy)); }
function isHazardChar(ch){ return ch === '~' || ch === '^'; }

/* Returns true when the AABB overlaps any solid tile. */
function boxHitsSolid(x, y, w, h){
  const x0 = Math.floor(x / TS), x1 = Math.floor((x + w - 1) / TS);
  const y0 = Math.floor(y / TS), y1 = Math.floor((y + h - 1) / TS);
  for(let cy = y0; cy <= y1; cy++)
    for(let cx = x0; cx <= x1; cx++)
      if(isSolidAt(cx, cy)) return true;
  return false;
}
function boxHitsChar(x, y, w, h, test){
  const x0 = Math.floor(x / TS), x1 = Math.floor((x + w - 1) / TS);
  const y0 = Math.floor(y / TS), y1 = Math.floor((y + h - 1) / TS);
  for(let cy = y0; cy <= y1; cy++)
    for(let cx = x0; cx <= x1; cx++)
      if(test(tileAt(cx, cy))) return true;
  return false;
}
function aabb(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/* -------------------- AXIS-SEPARATED TILE COLLISION --------------------- */
/* Moving one axis at a time and snapping out of the offending tile removes
   the classic "stuck in a block" corner bug.                               */
function moveX(ent, dx){
  if(dx === 0) return false;
  ent.x += dx;
  if(boxHitsSolid(ent.x, ent.y, ent.w, ent.h)){
    if(dx > 0){
      const col = Math.floor((ent.x + ent.w - 1) / TS);
      ent.x = col * TS - ent.w;
    } else {
      const col = Math.floor(ent.x / TS);
      ent.x = (col + 1) * TS;
    }
    return true;
  }
  return false;
}
function moveY(ent, dy){
  if(dy === 0) return 0;
  ent.y += dy;
  if(boxHitsSolid(ent.x, ent.y, ent.w, ent.h)){
    if(dy > 0){
      const row = Math.floor((ent.y + ent.h - 1) / TS);
      ent.y = row * TS - ent.h;
      return 1;    // landed
    } else {
      const row = Math.floor(ent.y / TS);
      ent.y = (row + 1) * TS;
      return -1;   // bonked head
    }
  }
  return 0;
}

/* ------------------------------ LEVEL START ----------------------------- */
function startLevel(idx){
  game.levelIndex = idx;
  level = parseLevel(idx);
  bakeTiles(level.theme);
  resetPlayer();
  level.camX = clamp(player.x - VW/2, 0, Math.max(0, level.W*TS - VW));
  game.state = STATE.PLAYING;
}
function resetPlayer(){
  player.x = player.spawnX; player.y = player.spawnY;
  player.vx = 0; player.vy = 0;
  player.grounded = false; player.dir = 1; player.animT = 0;
  player.coyote = 0; player.falling = false; player.fallFrom = player.y;
  player.carrier = null; player.inQuicksand = false;
  jumpBuffer = 0;
}
function restartLevel(){
  const keepScore = game.score;
  level = parseLevel(game.levelIndex);
  bakeTiles(level.theme);
  game.score = keepScore;
  resetPlayer();
  game.state = STATE.PLAYING;
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* -------------------------------- DEATH --------------------------------- */
function killPlayer(){
  if(game.state !== STATE.PLAYING) return;
  game.state = STATE.DYING;
  game.timer = 1.1;
  player.vy = -180;
  SFX.death();
  spawnBurst(player.x + player.w/2, player.y + player.h/2, 'C', 14);
}
function spawnBurst(x, y, col, n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 30 + Math.random()*70;
    level.particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 40, life: 0.5 + Math.random()*0.4, col });
  }
}

/* ------------------------------ INPUT ----------------------------------- */
window.addEventListener('keydown', e => {
  const k = e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Spacebar'].includes(k)) e.preventDefault();
  if(keys[k]) return;
  keys[k] = true;
  initAudio();
  if(AC && AC.state === 'suspended') AC.resume();

  const jumpKey = (k === 'ArrowUp' || k === ' ' || k === 'Spacebar' || k === 'w' || k === 'W');
  if(jumpKey){ jumpBuffer = JUMP_BUFFER; jumpHeld = true; }

  if(k === 'm' || k === 'M'){
    muted = !muted;
    if(masterGain) masterGain.gain.value = muted ? 0 : 0.28;
  }
  if((k === 'r' || k === 'R') && game.state === STATE.PLAYING) restartLevel();

  if(game.state === STATE.START){
    // Cheat code: typing DEV on the title screen toggles dev mode.
    if(k.length === 1 && /[a-z]/i.test(k)){
      devSeq = (devSeq + k.toUpperCase()).slice(-3);
      if(devSeq === 'DEV'){
        devSeq = '';
        setDevMode(!devMode);
        devMode ? SFX.relic() : SFX.hurt();
      }
    }

    // Level picker: Left/Right steps, 1-9 and 0 jump straight to a level.
    // Dev mode only — these keys are inert in normal play.
    if(devMode){
      const last = LEVELS.length - 1;
      let picked = null;
      if(k === 'ArrowLeft')  picked = (game.selectedLevel + last) % LEVELS.length;
      else if(k === 'ArrowRight') picked = (game.selectedLevel + 1) % LEVELS.length;
      else if(k >= '0' && k <= '9'){
        const n = (k === '0') ? 9 : (Number(k) - 1);   // '0' is the shortcut for level 10
        if(n <= last) picked = n;
      }
      if(picked !== null && picked !== game.selectedLevel){
        game.selectedLevel = picked;
        SFX.diamond();
      }
    }
  }

  // State advancement keys
  if(jumpKey || k === 'Enter'){
    if(game.state === STATE.START){ beginRun(); }
    else if(game.state === STATE.GAMEOVER || game.state === STATE.VICTORY){ game.state = STATE.START; game.titleT = 0; }
  }
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
  if(e.key === 'ArrowUp' || e.key === ' ' || e.key === 'Spacebar' || e.key === 'w' || e.key === 'W') jumpHeld = false;
});
window.addEventListener('blur', () => { for(const k in keys) keys[k] = false; jumpHeld = false; });

/* ------------------------------- UPDATE --------------------------------- */
function update(dt){
  game.blink += dt;
  switch(game.state){
    case STATE.START:      game.titleT += dt; break;
    case STATE.PLAYING:    updatePlaying(dt); break;
    case STATE.DYING:      updateDying(dt);   break;
    case STATE.TRANSITION:
      updateParticles(dt);
      game.timer -= dt;
      if(game.timer <= 0){
        if(game.levelIndex + 1 >= LEVELS.length){ game.state = STATE.VICTORY; game.timer = 0; SFX.victory(); }
        else startLevel(game.levelIndex + 1);
      }
      break;
  }
}

function updateDying(dt){
  player.vy = Math.min(player.vy + GRAVITY*dt, MAX_FALL);
  player.y += player.vy*dt;
  updateParticles(dt);
  game.timer -= dt;
  if(game.timer <= 0){
    game.lives--;
    if(game.lives <= 0){ game.state = STATE.GAMEOVER; SFX.gameover(); }
    else restartLevel();
  }
}

function updatePlaying(dt){
  const L = level;
  L.hazardT += dt;

  updateMovers(dt);
  updatePlayer(dt);
  updateEnemies(dt);
  updateVents(dt);
  updateChandeliers(dt);
  updateProjectiles(dt);
  updateParticles(dt);
  checkPickups();
  checkLethal();
  updateCamera(dt);

  // Exit door
  if(L.door && L.door.open && aabb(player, L.door)){
    completeLevel();
  }
}

function completeLevel(){
  SFX.complete();
  game.score += 250;                       // exit bonus
  game.state = STATE.TRANSITION;
  game.timer = 2.6;
}

/* ------------------------------- PLAYER --------------------------------- */
function updatePlayer(dt){
  const L = level;

  // --- environment sampling ---
  player.inQuicksand = boxHitsChar(player.x, player.y + player.h - 6, player.w, 6, ch => ch === 'Q');
  const slip = L.slippery;

  // --- horizontal input ---
  let want = 0;
  if(keys['ArrowLeft']  || keys['a'] || keys['A']) want -= 1;
  if(keys['ArrowRight'] || keys['d'] || keys['D']) want += 1;

  let target = want * MOVE_SPEED * (player.inQuicksand ? 0.35 : 1);
  if(slip){
    // Frozen Caverns: momentum carries, but pressing a direction still has
    // real authority — accelerate hard, coast gently.
    const accel = want !== 0 ? ICE_ACCEL : ICE_FRICTION;
    if(player.vx < target) player.vx = Math.min(player.vx + accel*dt, target);
    else if(player.vx > target) player.vx = Math.max(player.vx - accel*dt, target);
  } else {
    player.vx = target;
  }
  if(want !== 0) player.dir = want;

  // --- jumping (with coyote time + input buffering, variable height) ---
  if(player.grounded) player.coyote = COYOTE; else player.coyote -= dt;
  jumpBuffer -= dt;
  const canJump = (player.grounded || player.coyote > 0) && !player.inQuicksand;
  if(jumpBuffer > 0 && canJump){
    player.vy = JUMP_VEL;
    player.grounded = false; player.coyote = 0; jumpBuffer = 0;
    player.falling = false;
    SFX.jump();
  } else if(jumpBuffer > 0 && player.inQuicksand && (player.grounded || player.coyote > 0)){
    player.vy = JUMP_VEL * 0.45;    // feeble hop out of quicksand
    jumpBuffer = 0; SFX.jump();
  }
  if(!jumpHeld && player.vy < JUMP_CUT) player.vy = JUMP_CUT;

  // --- gravity ---
  const g = player.inQuicksand ? GRAVITY*0.25 : GRAVITY;
  player.vy = Math.min(player.vy + g*dt, player.inQuicksand ? 42 : MAX_FALL);

  // --- ride moving platforms ---
  if(player.carrier){
    const m = player.carrier;
    player.x += m.dx;
    if(boxHitsSolid(player.x, player.y, player.w, player.h)) player.x -= m.dx;
    if(m.dy !== 0){
      player.y += m.dy;
      if(boxHitsSolid(player.x, player.y, player.w, player.h)) player.y -= m.dy;
    }
  }

  // --- movement + tile collision, one axis at a time ---
  moveX(player, player.vx*dt);

  const wasFalling = player.vy > 0;
  if(wasFalling && !player.falling && !player.grounded){
    player.falling = true; player.fallFrom = player.y;
  }
  if(player.vy < 0) { player.falling = false; }

  const prevGrounded = player.grounded;
  player.grounded = false;
  player.carrier = null;

  const hit = moveY(player, player.vy*dt);
  if(hit === 1){
    landPlayer();
  } else if(hit === -1){
    player.vy = 0;
  }

  // --- moving-platform landing (they are entities, not tiles) ---
  if(!player.grounded && player.vy >= 0){
    for(const m of L.movers){
      const feet = player.y + player.h;
      if(player.x + player.w > m.x + 1 && player.x < m.x + m.w - 1 &&
         feet >= m.y - 1 && feet <= m.y + m.h*0.7 + Math.abs(player.vy*dt)){
        player.y = m.y - player.h;
        player.carrier = m;
        landPlayer();
        break;
      }
    }
  }
  if(prevGrounded && !player.grounded && player.vy >= 0 && !player.falling){
    player.falling = true; player.fallFrom = player.y;
  }

  // --- keep inside the level horizontally, die in the void ---
  player.x = clamp(player.x, 0, L.W*TS - player.w);
  if(player.y > L.H*TS + 40){ killPlayer(); return; }

  // --- animation frame selection ---
  if(!player.grounded) player.frame = 'jump';
  else if(want !== 0 || (slip && Math.abs(player.vx) > 12)){
    player.animT += dt * (2 + Math.abs(player.vx)/26);
    player.frame = (Math.floor(player.animT) % 2 === 0) ? 'walkA' : 'walkB';
  } else { player.frame = 'stand'; player.animT = 0; }
}

function landPlayer(){
  const fell = player.falling ? (player.y - player.fallFrom) : 0;
  player.grounded = true;
  player.vy = 0;
  player.falling = false;
  if(fell > FALL_DAMAGE && !player.inQuicksand){
    // Fall damage: nothing broke Dave's fall.
    killPlayer();
  }
}

/* ------------------------------ MOVERS ---------------------------------- */
function updateMovers(dt){
  for(const m of level.movers){
    const before = m.axis === 'x' ? m.x : m.y;
    if(m.axis === 'x'){
      m.x += m.dir * m.speed * dt;
      if(m.x > m.ox + m.range){ m.x = m.ox + m.range; m.dir = -1; }
      if(m.x < m.ox - m.range){ m.x = m.ox - m.range; m.dir = 1; }
      m.dx = m.x - before; m.dy = 0;
    } else {
      m.y += m.dir * m.speed * dt;
      if(m.y > m.oy + m.range){ m.y = m.oy + m.range; m.dir = -1; }
      if(m.y < m.oy - m.range){ m.y = m.oy - m.range; m.dir = 1; }
      m.dy = m.y - before; m.dx = 0;
    }
  }
}

/* ------------------------------ ENEMIES --------------------------------- */
function updateEnemies(dt){
  for(const e of level.enemies){
    if(!e.alive) continue;
    e.t += dt;
    if(e.hurtT > 0) e.hurtT -= dt;

    if(e.kind === 'boss'){ updateBoss(e, dt); continue; }

    if(e.fly){
      // Hovering / patrolling flyers
      e.x += e.dir * e.speed * dt;
      if(e.x > e.ox + e.range){ e.x = e.ox + e.range; e.dir = -1; }
      if(e.x < e.ox - e.range){ e.x = e.ox - e.range; e.dir = 1; }
      if(e.kind === 'ghost')        e.y = e.oy + Math.sin(e.t * 2.1) * e.amp;
      else if(e.kind === 'drone')   e.y = e.oy + Math.sin(e.t * 2.6) * 6;
      else if(e.kind === 'airship') e.y = e.oy + Math.sin(e.t * 3.4) * 3;
    } else if(e.ground){
      // Gravity + patrol with wall and ledge detection
      e.vy = Math.min(e.vy + GRAVITY*dt, MAX_FALL);
      if(e.hops){
        e.hopT -= dt;
        if(e.hopT <= 0 && e.onGround){ e.vy = -180; e.hopT = 1.3 + Math.random()*0.6; }
      }
      const bump = moveX(e, e.dir * e.speed * dt);
      if(bump) e.dir *= -1;
      e.onGround = false;
      const r = moveY(e, e.vy*dt);
      if(r === 1){ e.vy = 0; e.onGround = true; }
      else if(r === -1) e.vy = 0;

      if(e.onGround){
        // turn around at ledges so patrollers never walk off
        const ahead = e.dir > 0 ? e.x + e.w + 2 : e.x - 2;
        const cx = Math.floor(ahead / TS), cy = Math.floor((e.y + e.h + 2) / TS);
        if(!isSolidAt(cx, cy) || isHazardChar(tileAt(cx, cy)) || tileAt(cx,cy) === 'Q') e.dir *= -1;
      }
      // stay on a fixed beat around the spot the level placed them
      if(e.range){
        if(e.x > e.ox + e.range){ e.x = e.ox + e.range; e.dir = -1; }
        if(e.x < e.ox - e.range){ e.x = e.ox - e.range; e.dir = 1; }
      }
      if(e.x < 0){ e.x = 0; e.dir = 1; }
      if(e.x + e.w > level.W*TS){ e.x = level.W*TS - e.w; e.dir = -1; }
    }
  }
}

function updateBoss(b, dt){
  // Dr. Dark: paces his hall, lobs dark orbs, must be stomped three times.
  b.vy = Math.min(b.vy + GRAVITY*dt, MAX_FALL);
  const speed = b.speed + (3 - b.hp) * 18;
  const bump = moveX(b, b.dir * speed * dt);
  if(bump) b.dir *= -1;
  if(b.x > b.ox + b.range){ b.x = b.ox + b.range; b.dir = -1; }
  if(b.x < b.ox - b.range){ b.x = b.ox - b.range; b.dir = 1; }
  const r = moveY(b, b.vy*dt);
  if(r !== 0) b.vy = 0;

  b.fireT -= dt;
  if(b.fireT <= 0){
    b.fireT = 1.5 - (3 - b.hp) * 0.25;
    const sx = b.x + b.w/2, sy = b.y + 12;
    const dx = (player.x + player.w/2) - sx;
    const dirx = dx === 0 ? 1 : Math.sign(dx);
    level.projectiles.push({ x: sx - 3, y: sy, w: 6, h: 6, vx: dirx * 105, vy: -60, t: 0 });
    SFX.shoot();
  }
}

function hurtBoss(b){
  b.hp--;
  b.hurtT = 1.1;
  game.score += 300;
  SFX.stomp();
  spawnBurst(b.x + b.w/2, b.y + 6, 'D', 12);
  if(b.hp <= 0){
    b.alive = false;
    level.bossDefeated = true;
    game.score += 2000;
    // Dr. Dark drops the final relic where he falls.
    level.pickups.push({ kind:'R', x: b.x + b.w/2 - 8, y: b.y + b.h - TS, w:TS, h:TS, taken:false, bob:0 });
    spawnBurst(b.x + b.w/2, b.y + b.h/2, 'E', 26);
  }
}

/* ------------------------- VENTS / CHANDELIERS -------------------------- */
function updateVents(dt){
  for(const v of level.vents){
    v.t += dt;
    if(v.t >= v.period){
      v.t = 0;
      level.projectiles.push({ x: v.x, y: v.y, w: 8, h: 10, vx: 0, vy: -235, t: 0, fire: true });
      tone('sawtooth', 180, 90, 0.22, 0.08);
    }
  }
}
function updateChandeliers(dt){
  for(const c of level.chandeliers){
    if(c.state === 'hang'){
      const px_ = player.x + player.w/2;
      if(Math.abs(px_ - (c.x + c.w/2)) < 22 && player.y > c.y){
        c.state = 'fall'; c.vy = 0;
        tone('square', 900, 500, 0.1, 0.1);
      }
    } else if(c.state === 'fall'){
      c.vy = Math.min(c.vy + GRAVITY*dt, MAX_FALL);
      c.y += c.vy*dt;
      if(boxHitsSolid(c.x, c.y, c.w, c.h) || c.y > level.H*TS){
        c.state = 'gone'; c.respawn = 2.8;
        noiseBurst(0.16, 0.12);
        spawnBurst(c.x + c.w/2, c.y, 'E', 8);
      }
    } else {
      c.respawn -= dt;
      if(c.respawn <= 0){ c.state = 'hang'; c.y = c.oy; c.vy = 0; }
    }
  }
}
function updateProjectiles(dt){
  const L = level;
  for(let i = L.projectiles.length - 1; i >= 0; i--){
    const p = L.projectiles[i];
    p.t += dt;
    p.vy += (p.fire ? 430 : 260) * dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.t > 5 || p.y > L.H*TS + 40 || p.x < -20 || p.x > L.W*TS + 20){ L.projectiles.splice(i,1); continue; }
    if(boxHitsSolid(p.x, p.y, p.w, p.h)){
      // fireballs splash out on a ceiling, orbs burst on any wall
      L.projectiles.splice(i,1);
      spawnBurst(p.x, p.y, p.fire ? 'E' : '5', 6);
    }
  }
}
function updateParticles(dt){
  const P = level ? level.particles : null;
  if(!P) return;
  for(let i = P.length - 1; i >= 0; i--){
    const p = P[i];
    p.life -= dt;
    if(p.life <= 0){ P.splice(i,1); continue; }
    p.vy += 320*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}

/* ------------------------------ PICKUPS --------------------------------- */
function checkPickups(){
  const L = level;
  for(const p of L.pickups){
    if(p.taken) continue;
    if(aabb(player, { x:p.x+2, y:p.y+2, w:p.w-4, h:p.h-4 })){
      p.taken = true;
      if(p.kind === 'R'){
        L.relicsGot++; game.relicsCollected++;
        game.score += 1000; SFX.relic();
        spawnBurst(p.x+8, p.y+8, 'E', 18);
        if(L.relicsGot >= L.relicsNeeded && L.door){ L.door.open = true; SFX.door(); }
      } else if(p.kind === 'T'){
        game.score += 500; SFX.trophy();
        spawnBurst(p.x+8, p.y+8, 'E', 8);
      } else {
        game.score += 100; SFX.diamond();
      }
    }
  }
}

/* ------------------------- LETHAL COLLISIONS ---------------------------- */
function checkLethal(){
  const L = level;
  const box = { x: player.x + 1, y: player.y + 1, w: player.w - 2, h: player.h - 2 };

  // Hazard tiles (spikes, toxic water, lava)
  if(boxHitsChar(box.x, box.y, box.w, box.h, isHazardChar)){ killPlayer(); return; }

  // Enemies
  for(const e of L.enemies){
    if(!e.alive) continue;
    const ebox = { x:e.x+1, y:e.y+1, w:e.w-2, h:e.h-2 };
    if(!aabb(box, ebox)) continue;

    if(e.kind === 'boss'){
      const stomping = player.vy > 30 && (player.y + player.h) < e.y + 16;
      if(stomping){
        if(e.hurtT <= 0) hurtBoss(e);
        player.vy = JUMP_VEL * 0.85;
        player.falling = false;
        return;
      }
      if(e.hurtT > 0.55) return;    // brief mercy window after a stomp
      killPlayer(); return;
    }
    killPlayer(); return;
  }

  // Projectiles / fireballs / falling chandeliers
  for(const p of L.projectiles){ if(aabb(box, p)){ killPlayer(); return; } }
  for(const c of L.chandeliers){
    if(c.state === 'fall' && aabb(box, c)){ killPlayer(); return; }
  }
}

/* ------------------------------- CAMERA --------------------------------- */
function updateCamera(dt){
  const target = clamp(player.x + player.w/2 - VW/2, 0, Math.max(0, level.W*TS - VW));
  level.camX += (target - level.camX) * Math.min(1, dt * 7.5);
  level.camX = clamp(level.camX, 0, Math.max(0, level.W*TS - VW));
}

/* ------------------------------- RENDER --------------------------------- */
function render(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, VW, VH);

  switch(game.state){
    case STATE.START:      drawStartScreen(); break;
    case STATE.PLAYING:
    case STATE.DYING:      drawWorld(); drawHUD(); break;
    case STATE.TRANSITION: drawTransition(); break;
    case STATE.GAMEOVER:   drawGameOver(); break;
    case STATE.VICTORY:    drawVictory(); break;
  }
}

function drawWorld(){
  const L = level, cam = Math.round(L.camX);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, HUD_H, VW, VIEW_H); ctx.clip();
  ctx.translate(-cam, HUD_H);

  // Star field for night-time themes
  if(L.theme.star){
    ctx.fillStyle = PAL['7'];
    for(let i=0;i<50;i++){
      const sx = ((i*137) % (L.W*TS));
      const sy = ((i*89) % (VIEW_H - 20)) + 4;
      if(sx > cam - 4 && sx < cam + VW + 4) ctx.fillRect(sx, sy, 1, 1);
    }
  }

  // --- tiles ---
  const c0 = Math.max(0, Math.floor(cam / TS));
  const c1 = Math.min(L.W - 1, Math.ceil((cam + VW) / TS));
  const hz = hazardFrames[Math.floor(L.hazardT * 6) % hazardFrames.length];
  for(let y=0;y<L.H;y++){
    for(let x=c0;x<=c1;x++){
      const ch = L.grid[y][x];
      if(ch === ' ') continue;
      if(ch === '~') ctx.drawImage(hz, x*TS, y*TS);
      else if(tileCanvas[ch]) ctx.drawImage(tileCanvas[ch], x*TS, y*TS);
    }
  }

  // --- exit door ---
  if(L.door){
    ctx.drawImage(L.door.open ? tileCanvas['DOOR_OPEN'] : tileCanvas['DOOR_CLOSED'], L.door.x, L.door.y);
    if(L.door.open && Math.floor(game.blink*4) % 2 === 0){
      ctx.fillStyle = PAL['E'];
      ctx.fillRect(L.door.x - 1, L.door.y - 2, TS + 2, 1);
    }
  }

  // --- moving platforms ---
  for(const m of L.movers){
    ctx.fillStyle = PAL[L.theme.plank];
    ctx.fillRect(m.x, m.y, m.w, m.h);
    ctx.fillStyle = PAL[L.theme.plankHi];
    ctx.fillRect(m.x, m.y, m.w, 2);
    ctx.fillStyle = PAL['0'];
    ctx.fillRect(m.x, m.y + m.h - 1, m.w, 1);
    for(let i=4;i<m.w;i+=10) ctx.fillRect(m.x+i, m.y+4, 2, 2);
  }

  // --- chandeliers ---
  for(const c of L.chandeliers){
    if(c.state === 'gone') continue;
    if(c.state === 'hang'){
      ctx.fillStyle = PAL['8'];
      ctx.fillRect(c.x + 7, c.y - 10, 2, 10);
    }
    ctx.fillStyle = PAL['E'];
    ctx.fillRect(c.x + 2, c.y, 12, 5);
    ctx.fillRect(c.x, c.y + 5, 16, 3);
    ctx.fillStyle = PAL['C'];
    ctx.fillRect(c.x + 1, c.y + 8, 2, 3);
    ctx.fillRect(c.x + 7, c.y + 8, 2, 3);
    ctx.fillRect(c.x + 13, c.y + 8, 2, 3);
  }

  // --- pickups (gentle bob, like the original's shimmer) ---
  for(const p of L.pickups){
    if(p.taken) continue;
    const bob = Math.sin(L.hazardT * 3 + p.bob) * 1.5;
    const art = ART[p.kind];
    ctx.drawImage(art, Math.round(p.x), Math.round(p.y + bob));
    if(p.kind === 'R' && Math.floor(game.blink*6) % 2 === 0){
      ctx.fillStyle = PAL['F'];
      ctx.fillRect(Math.round(p.x + 7), Math.round(p.y + bob - 3), 2, 2);
    }
  }

  // --- projectiles ---
  for(const p of L.projectiles){
    if(p.fire){
      ctx.fillStyle = PAL['E']; ctx.fillRect(p.x+1, p.y+2, p.w-2, p.h-4);
      ctx.fillStyle = PAL['C']; ctx.fillRect(p.x, p.y, p.w, 2);
      ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
    } else {
      ctx.fillStyle = PAL['5']; ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = PAL['D']; ctx.fillRect(p.x+1, p.y+1, p.w-2, p.h-2);
      ctx.fillStyle = PAL['0']; ctx.fillRect(p.x+2, p.y+2, 2, 2);
    }
  }

  // --- enemies ---
  for(const e of L.enemies){
    if(!e.alive) continue;
    const flash = e.hurtT > 0 && Math.floor(e.hurtT*14) % 2 === 0;
    if(flash) continue;
    const alpha = e.kind === 'ghost' ? 0.78 : 1;
    drawSprite(ctx, e.grid, e.x, e.y, e.dir > 0, alpha);
  }

  // --- Dave ---
  if(game.state === STATE.DYING){
    if(Math.floor(game.blink*20) % 2 === 0)
      drawSprite(ctx, SPR_DAVE.jump, player.x, player.y - 1, player.dir < 0);
  } else {
    drawSprite(ctx, SPR_DAVE[player.frame], player.x, player.y - 1, player.dir < 0);
  }

  // --- particles ---
  for(const p of L.particles){
    ctx.fillStyle = PAL[p.col];
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
  }

  ctx.restore();
}

/* --------------------------------- HUD ---------------------------------- */
function drawHUD(){
  ctx.fillStyle = PAL['0'];
  ctx.fillRect(0, 0, VW, HUD_H);

  // Divider bar, in the spirit of the original status strip
  ctx.fillStyle = PAL['7'];
  ctx.fillRect(0, HUD_H - 3, VW, 1);
  ctx.fillStyle = PAL['8'];
  ctx.fillRect(0, HUD_H - 2, VW, 2);

  const score = String(game.score).padStart(5, '0');
  const lvl   = String(game.levelIndex + 1).padStart(2, '0');
  drawText(ctx, 'SCORE:' + score, 4, 3, 'F');
  drawText(ctx, 'LEVEL:' + lvl, 116, 3, 'F');
  drawText(ctx, 'DAVES:', 186, 3, 'F');

  // Red cap icons = remaining lives
  for(let i=0;i<Math.max(0, game.lives);i++){
    const hx = 224 + i*13, hy = 2;
    ctx.fillStyle = PAL['4']; ctx.fillRect(hx+2, hy,   6, 2);
    ctx.fillStyle = PAL['C']; ctx.fillRect(hx+1, hy+2, 8, 2);
    ctx.fillStyle = PAL['4']; ctx.fillRect(hx,   hy+4, 11, 2);
    ctx.fillStyle = PAL['E']; ctx.fillRect(hx+3, hy+6, 4, 1);
  }

  // Second line: level name + relic / door status
  const L = level;
  drawText(ctx, L ? L.def.name : '', 4, 14, '3');
  if(devMode) drawText(ctx, 'DEV', 128, 14, '5');
  if(L){
    const got = L.relicsGot >= L.relicsNeeded;
    ctx.drawImage(ART.R, 232, 12);
    const msg = got ? 'DOOR OPEN' : 'FIND RELIC';
    const col = got ? 'A' : (Math.floor(game.blink*3) % 2 === 0 ? 'C' : '4');
    drawText(ctx, msg, 250, 14, col);
  }
}

/* ----------------------------- SCREENS ---------------------------------- */
function drawStartScreen(){
  const t = game.titleT;
  // starry backdrop
  ctx.fillStyle = PAL['8'];
  for(let i=0;i<70;i++){
    const sx = (i*53) % VW, sy = (i*97) % VH;
    if(((i + Math.floor(t*2)) % 7) !== 0) ctx.fillRect(sx, sy, 1, 1);
  }

  drawTextCentered(ctx, 'DANGEROUS DAVE', 24, 'C', 2);
  drawTextCentered(ctx, '2', 44, 'E', 2);
  drawTextCentered(ctx, 'THE RELIC RETRIEVAL', 62, 'E', 1);

  ctx.fillStyle = PAL['4']; ctx.fillRect(60, 76, 200, 1);

  drawTextCentered(ctx, 'DR. DARK HAS RAIDED THE MUSEUM', 88,  '7');
  drawTextCentered(ctx, 'AND STOLEN THE 10 LEGENDARY', 98,  '7');
  drawTextCentered(ctx, 'RELICS OF THE KINGDOM.', 108, '7');
  drawTextCentered(ctx, 'STRAP ON THE RED CAP AND', 122, 'B');
  drawTextCentered(ctx, 'TAKE THEM BACK, DAVE!', 132, 'B');

  // Dave waves from the middle of the screen
  const bob = Math.sin(t*4) > 0 ? 0 : 1;
  drawSprite(ctx, SPR_DAVE[bob ? 'walkA' : 'walkB'], 154, 150 + (bob?0:1), false);
  ctx.drawImage(ART.R, 186, 152);
  ctx.drawImage(ART.T, 118, 152);
  ctx.fillStyle = PAL['6']; ctx.fillRect(96, 168, 128, 4);
  ctx.fillStyle = PAL['E']; ctx.fillRect(96, 168, 128, 1);

  if(devMode){
    if(Math.floor(t*2) % 2 === 0)
      drawTextCentered(ctx, 'PRESS SPACE TO BEGIN', 182, 'F');
    drawLevelSelector(196);               // label 196-202, pips at 207-209
    drawTextCentered(ctx, 'ARROWS SELECT LEVEL    1-0 QUICK PICK', 216, '8');
    drawDevBadge();
  } else {
    // Normal mode: the original title screen, with no trace of the picker.
    if(Math.floor(t*2) % 2 === 0)
      drawTextCentered(ctx, 'PRESS SPACE TO BEGIN', 190, 'F');
    drawTextCentered(ctx, 'ARROWS MOVE   UP/SPACE JUMP   M MUTE', 214, '8');
  }
}

/* Small corner tag so a dev-mode session is never mistaken for a real run. */
function drawDevBadge(){
  const label = 'DEV MODE';
  const w = textWidth(label);
  const x = VW - w - 6;
  ctx.fillStyle = PAL['5'];
  ctx.fillRect(x - 3, 3, w + 6, 11);
  drawText(ctx, label, x, 5, Math.floor(game.blink * 2) % 2 === 0 ? 'D' : 'F');
}

/* Title-screen level picker. Purely a testing shortcut — the default selection
   is level 1, so pressing space still starts a normal run. */
function drawLevelSelector(y){
  const sel   = game.selectedLevel;
  const label = 'LEVEL ' + String(sel + 1).padStart(2, '0') + '  ' + LEVELS[sel].name;
  const w     = textWidth(label);
  const x     = Math.round((VW - w) / 2);

  drawText(ctx, label, x, y, 'E');
  // Chevrons pulse so it reads as adjustable rather than a static caption.
  const pulse = Math.floor(game.blink * 3) % 2 === 0 ? 'B' : '3';
  drawText(ctx, '<', x - 14, y, pulse);
  drawText(ctx, '>', x + w + 8, y, pulse);

  // Progress pips: one per level, the selected one brighter and wider.
  const pipW = 8, totalW = LEVELS.length * pipW;
  const px0  = Math.round((VW - totalW) / 2);
  for(let i = 0; i < LEVELS.length; i++){
    const on = (i === sel);
    ctx.fillStyle = PAL[on ? 'E' : '8'];
    ctx.fillRect(px0 + i*pipW, y + 11, on ? 6 : 4, on ? 3 : 2);
  }
}

function drawTransition(){
  const remaining = LEVELS.length - (game.levelIndex + 1);
  drawTextCentered(ctx, 'GOOD WORK!', 92, 'F', 2);
  if(remaining > 0){
    drawTextCentered(ctx, 'ONLY ' + remaining + ' MORE TO GO!', 122, 'E', 1);
  } else {
    drawTextCentered(ctx, 'THAT WAS THE LAST ONE!', 122, 'E', 1);
  }
  drawTextCentered(ctx, 'RELICS RECOVERED: ' + game.relicsCollected + '/10', 142, 'B');
  drawTextCentered(ctx, 'SCORE: ' + String(game.score).padStart(5,'0'), 156, '7');
  ctx.drawImage(ART.R, VW/2 - 8, 176);
}

function drawGameOver(){
  drawTextCentered(ctx, 'GAME OVER', 90, 'C', 2);
  drawTextCentered(ctx, 'DR. DARK KEEPS THE RELICS...', 120, '7');
  drawTextCentered(ctx, 'FINAL SCORE: ' + String(game.score).padStart(5,'0'), 138, 'E');
  drawTextCentered(ctx, 'RELICS RECOVERED: ' + game.relicsCollected + '/10', 152, 'B');
  if(Math.floor(game.blink*2) % 2 === 0)
    drawTextCentered(ctx, 'PRESS SPACE', 186, 'F');
}

function drawVictory(){
  ctx.fillStyle = PAL['8'];
  for(let i=0;i<60;i++){
    const sx = (i*61) % VW, sy = (i*41) % VH;
    if(((i + Math.floor(game.blink*3)) % 5) !== 0) ctx.fillRect(sx, sy, 1, 1);
  }
  drawTextCentered(ctx, 'VICTORY!', 40, 'E', 2);
  drawTextCentered(ctx, 'ALL 10 RELICS ARE HOME', 70, 'F');
  drawTextCentered(ctx, 'AND DR. DARK IS FINISHED.', 82, 'F');
  drawTextCentered(ctx, 'THE MUSEUM IS SAVED!', 100, 'B');
  for(let i=0;i<10;i++) ctx.drawImage(ART.R, 80 + i*16, 118 + (Math.sin(game.blink*3 + i)*3|0));
  drawTextCentered(ctx, 'FINAL SCORE: ' + String(game.score).padStart(5,'0'), 150, 'E');
  drawSprite(ctx, SPR_DAVE.stand, VW/2 - 6, 168, false);
  if(Math.floor(game.blink*2) % 2 === 0)
    drawTextCentered(ctx, 'PRESS SPACE', 202, 'F');
}

/* ------------------------------ MAIN LOOP -------------------------------- */
let lastT = 0;
function frame(ts){
  if(!lastT) lastT = ts;
  let dt = (ts - lastT) / 1000;
  lastT = ts;
  if(dt > 1/30) dt = 1/30;      // clamp so tab-switching never tunnels Dave through tiles
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ------------------------------ BOOTSTRAP -------------------------------- */
function resize(){
  const scale = Math.max(1, Math.floor(Math.min(window.innerWidth / VW, (window.innerHeight - 18) / VH)));
  canvas.style.width  = (VW * scale) + 'px';
  canvas.style.height = (VH * scale) + 'px';
}
window.addEventListener('resize', resize);

bakeArt();
bakeTiles(THEMES.museum);
resize();
requestAnimationFrame(frame);

// Touch / click also starts the game (and unlocks audio) on non-keyboard devices.
canvas.addEventListener('pointerdown', () => {
  initAudio();
  if(AC && AC.state === 'suspended') AC.resume();
  if(game.state === STATE.START){ beginRun(); }
  else if(game.state === STATE.GAMEOVER || game.state === STATE.VICTORY){ game.state = STATE.START; game.titleT = 0; }
});
</script>
